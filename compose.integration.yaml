name: demi-integration

services:
  postgres:
    image: postgres:17-alpine
    restart: "no"
    # Diagnostics only (no behaviour change): log lock waits over 1s with the blocking process, and statements over
    # 2s, so an intermittent stall can be read from `npm run test:db:logs` instead of guessed.
    command:
      - postgres
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=1s
      - -c
      - log_min_duration_statement=2000
      - -c
      - "log_line_prefix=%m [%p] %q%u@%d "
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:?POSTGRES_HOST_PORT is required}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./scripts/integration-database-init.sql:/docker-entrypoint-initdb.d/demi-integration.sql:ro
